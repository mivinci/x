name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          MDBOOK_VERSION=0.4.44
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv mdbook /usr/local/bin/

      - name: Install mdbook-mermaid
        run: |
          MERMAID_VERSION=0.14.0
          curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MERMAID_VERSION}/mdbook-mermaid-v${MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv mdbook-mermaid /usr/local/bin/

      - name: Install doxygen
        run: sudo apt-get install -y doxygen

      - name: Build docs
        run: |
          cd docs
          mdbook-mermaid install .
          mdbook build

      - name: Generate API docs
        run: |
          cd docs
          mkdir -p ../book/api/x ../book/api/xpp
          doxygen Doxyfile.libx
          doxygen Doxyfile.libxpp

      - name: Fix doxygen template spacing
        run: |
          cd book
          find api -name '*.html' ! -name '*_source.html' -print0 | xargs -0 perl -pi -e 's/&lt; /&lt;/g; s/ &gt;/&gt;/g'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book
      - uses: actions/deploy-pages@v4
