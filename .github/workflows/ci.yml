name: CI

on:
  push:
    branches: [main]
    paths:
      - '**.c'
      - '**.h'
      - '**.cpp'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '.clang-format'
      - '.clang-tidy'
      - 'scripts/check-exports.sh'
      - 'scripts/export-allowlist.txt'
      - 'scripts/run-clang-tidy.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.c'
      - '**.h'
      - '**.cpp'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '.clang-format'
      - '.clang-tidy'
      - 'scripts/check-exports.sh'
      - 'scripts/export-allowlist.txt'
      - 'scripts/run-clang-tidy.sh'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.tls }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tls: [openssl, mbedtls]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Install dependencies ──────────────────────────────────────────
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libgtest-dev \
            libnghttp2-dev \
            libssl-dev \
            libmbedtls-dev \
            libusrsctp-dev \
            libcurl4-openssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install googletest llhttp nghttp2 openssl mbedtls libusrsctp curl

      # ── Build cache ────────────────────────────────────────────────────
      - name: Compute cache key
        id: cache-key
        run: |
          HASH=$(cat CMakeLists.txt libx/x/*/CMakeLists.txt cmake/*.cmake 2>/dev/null | sha256sum | cut -c1-8)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ matrix.tls }}-${{ steps.cache-key.outputs.hash }}
          restore-keys: |
            build-${{ runner.os }}-${{ matrix.tls }}-

      # ── Build & Test ──────────────────────────────────────────────────
      - name: Build & Test (Linux)
        if: runner.os == 'Linux'
        run: |
          rm -f build/CMakeCache.txt
          bash scripts/test-linux.sh -t ${{ matrix.tls }} -j $(nproc) -B build --asan

      - name: Build & Test (macOS)
        if: runner.os == 'macOS'
        run: |
          rm -f build/CMakeCache.txt
          zsh scripts/test-mac.sh -t ${{ matrix.tls }} -j $(sysctl -n hw.ncpu) -B build --asan

  # ── Symbol visibility check ───────────────────────────────────────────
  # Verifies that X_BUILD_SHARED=ON produces a clean symbol table:
  # only XCAPI-marked symbols (and allowlisted internal symbols) are exported.
  export-check:
    name: Symbol visibility (shared build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libgtest-dev \
            libnghttp2-dev \
            libssl-dev \
            libusrsctp-dev \
            libcurl4-openssl-dev \
            ninja-build

      - name: Build with X_BUILD_SHARED=ON
        run: |
          cmake -B build-shared -G Ninja -DX_BUILD_SHARED=ON -DX_TLS_BACKEND=openssl
          cmake --build build-shared -j $(nproc)

      - name: Run tests
        run: |
          cd build-shared && ctest --output-on-failure --timeout 120

      - name: Check exported symbols
        run: |
          FAIL=0
          for lib in \
            libx/x/base/libxbase \
            libx/x/buf/libxbuf \
            libx/x/net/libxnet \
            libx/x/http/libxhttp \
            libx/x/crypto/libxcrypto \
            libx/x/dns/libxdns \
            libx/x/fs/libxfs \
            libdlproxy/libdlproxy; do
            ./scripts/check-exports.sh "build-shared/${lib}.so" scripts/export-allowlist.txt || FAIL=1
          done
          exit $FAIL

  # ── clang-tidy ────────────────────────────────────────────────────────
  # Lint test files using the .clang-tidy config. Currently enforces
  # google-readability-casting (no C-style casts). Adding new checks
  # requires fixing all existing violations first — see .clang-tidy.
  clang-tidy:
    name: clang-tidy (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            clang-tidy \
            libgtest-dev \
            libnghttp2-dev \
            libssl-dev \
            libusrsctp-dev \
            libcurl4-openssl-dev \
            ninja-build

      - name: Generate compile_commands.json
        run: |
          cmake -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DX_TLS_BACKEND=openssl

      - name: Run clang-tidy
        run: |
          ./scripts/run-clang-tidy.sh -j $(nproc)

  # ── clang-format ──────────────────────────────────────────────────────
  # Verifies that all source files are clang-formatted. The .clang-format
  # config enforces Google-style include ordering (5 groups, project
  # headers last) plus alignment, wrapping, and spacing rules.
  #
  # Pins clang-format to the LLVM official apt version to match what
  # developers run locally (Homebrew LLVM on macOS, also ~21.x).
  # Using Ubuntu's bundled clang-format (older, ~14) produces different
  # formatting output and causes spurious failures.
  clang-format:
    name: clang-format (format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format (LLVM official)
        run: |
          # Use LLVM's apt source for a recent clang-format that matches
          # what developers run locally (Homebrew LLVM on macOS).
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-21
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-21 100

      - name: Check formatting
        run: |
          clang-format --version
          find libx libdlproxy \( -name '*.c' -o -name '*.h' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
